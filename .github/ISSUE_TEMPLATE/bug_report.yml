name: Bug Report
description: Report a TrimControl bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: "14.6"
    validations:
      required: true
  - type: input
    id: trimcontrol-version
    attributes:
      label: TrimControl Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: terminal-backend
    attributes:
      label: Terminal Backend
      placeholder: "Apple Terminal, iTerm2, Ghostty, WezTerm, Alacritty, or Custom Command"
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include the file extension involved, but do not include private file contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
